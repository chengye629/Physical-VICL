ontology_version: physics_ontology_v7_alpha3
design:
  core_dimensions:
  - object
  - process
  - impact
  - mechanism
  representation: closed_families_open_subtypes
  principles:
  - Object, Process, Impact, and Mechanism remain semantically distinct.
  - Coarse process family, impact axis, and mechanism family are closed.
  - Canonical subtype is optional and open-vocabulary text is always preserved.
  - Static is represented by special/none plus temporal fields, not a process family.
  - Combustion and explosive release are distinct process families.
  - Object roles are completed deterministically from action, process, and impact references.
  - Explicit object relation triples are excluded from the Physics Card because they were unstable.
  - Camera-only changes are separated from scene physics by deterministic rules.
object:
  axes:
  - name: entity_kind
    definition: Physical form of an entity; event function belongs to event_roles instead.
    cardinality: single
    required: true
    labels:
    - label: agent
      definition: Person, animal, or autonomous robot that can initiate an action.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: rigid_solid
      definition: Solid object with no visually significant deformation at the video scale.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: deformable_solid
      definition: Solid object that visibly changes shape continuously.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: articulated_object
      definition: Object composed of rigid parts connected by joints.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: liquid_body
      definition: Continuous liquid volume with flow or a free surface.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: gas_or_vapor
      definition: Continuous gaseous substance or vapor.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: aerosol_or_smoke
      definition: Visible particles suspended in a gas, including smoke, mist, and spray clouds.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: granular_material
      definition: Collection of many discrete grains or particles such as sand, powder, or snow.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: surface_or_region
      definition: Surface or spatial region mainly serving as support, boundary, or interaction area.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: unknown
      definition: Physical form cannot be determined reliably.
      include_when: []
      exclude_when: []
      confusable_with: []
  - name: event_roles
    definition: Functional roles of an entity in the annotated event. Multiple roles are allowed.
    cardinality: multi
    required: true
    labels:
    - label: actor
      definition: Entity that visibly performs or initiates an intervention.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: target
      definition: Entity receiving the main action or undergoing the main state change.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: tool
      definition: Intermediate object used by an actor to apply an action.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: support
      definition: Entity or surface that supports another entity or provides an interaction surface.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: container
      definition: Entity that spatially contains or bounds another object or material.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: medium
      definition: Material or region through which another entity moves or in which the process occurs.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: source
      definition: Entity from which material, light, heat, gas, particles, or energy is released.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: product
      definition: Entity or material newly formed, separated, or emitted by the event.
      include_when: []
      exclude_when: []
      confusable_with: []
  - name: material_phase
    definition: Coarse material phase visible or strongly supported by the video.
    cardinality: single
    required: false
    labels:
    - label: solid
      definition: Material retains a persistent shape at the observed scale.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: liquid
      definition: Material flows and conforms to boundaries while maintaining a free surface or volume.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: gas
      definition: Material is gaseous or vapor-like.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: granular
      definition: Material consists of many discrete grains.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: mixed
      definition: Entity contains multiple materially distinct phases that cannot be separated for this event.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: not_applicable
      definition: Material phase is not meaningful for this entity, such as a spatial region.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: unknown
      definition: Material phase cannot be determined reliably.
      include_when: []
      exclude_when: []
      confusable_with: []
  - name: physical_properties
    definition: Behavioral or optical properties supported by visible evidence; do not infer unsupported properties.
    cardinality: multi
    required: false
    labels:
    - label: rigid
      definition: Shows negligible visible deformation under the observed interaction.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: flexible
      definition: Can bend or fold visibly; recoverability is not implied.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: elastic
      definition: Visible deformation is substantially recovered after unloading.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: plastically_deformable
      definition: Visible deformation persists after loading is removed.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: brittle
      definition: Fractures with little visible plastic deformation.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: viscous
      definition: Flows slowly or resists shape change under sustained loading.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: adhesive
      definition: Forms persistent adhesion with another surface.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: transparent
      definition: Transmits light with clear visibility through the material.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: translucent
      definition: Transmits light but obscures detailed visibility.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: reflective
      definition: Produces clear or strong reflected light patterns.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: emissive
      definition: Acts as a visible source of light or thermal glow.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: combustible
      definition: Visible evidence shows that the material can burn in this event.
      include_when: []
      exclude_when: []
      confusable_with: []
  - name: initial_motion_state
    definition: Motion state before the primary process begins.
    cardinality: single
    required: true
    labels:
    - label: stationary
      definition: No discernible object motion before the event.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: translating
      definition: Object position changes without rotation being dominant.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: rotating
      definition: Angular motion is dominant.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: oscillating
      definition: Object repeatedly moves around an equilibrium state.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: falling
      definition: Object is already moving downward without support.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: flowing
      definition: Continuous material is already flowing.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: dispersing
      definition: Gas, aerosol, or particles are already spreading.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: unknown
      definition: Initial motion cannot be determined.
      include_when: []
      exclude_when: []
      confusable_with: []
  - name: initial_integrity_state
    definition: Structural integrity before the primary process begins.
    cardinality: single
    required: false
    labels:
    - label: intact
      definition: Object is whole with no visible major fracture.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: deformed
      definition: Object already has a visible shape deformation.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: cracked
      definition: Object contains visible cracks but remains largely connected.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: fragmented
      definition: Object already consists of multiple fragments.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: separated
      definition: Previously connected parts are visibly separate.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: not_applicable
      definition: Integrity is not meaningful for this entity.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: unknown
      definition: Integrity cannot be determined.
      include_when: []
      exclude_when: []
      confusable_with: []
process:
  action_families:
  - label: release
    definition: Actions that remove support or impart free motion.
    types:
    - label: release
      definition: Remove restraint or support without a clearly intentional downward placement.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: drop
      definition: Release an object so that it begins downward free motion.
      include_when: []
      exclude_when: []
      confusable_with:
      - release
      - throw
    - label: throw
      definition: Impart an initial velocity and release the object.
      include_when: []
      exclude_when: []
      confusable_with: []
  - label: transport
    definition: Actions that move or reorient an object.
    types:
    - label: push
      definition: Apply force away from the actor.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: pull
      definition: Apply force toward the actor.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: lift
      definition: Move an object upward while supporting it.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: lower
      definition: Move an object downward while maintaining support.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: move
      definition: Move an object when a more specific transport action is not supported.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: rotate
      definition: Actively turn an object around an axis.
      include_when: []
      exclude_when: []
      confusable_with: []
  - label: loading
    definition: Actions that apply mechanical loading.
    types:
    - label: strike
      definition: Apply a brief high-rate contact action.
      include_when: []
      exclude_when: []
      confusable_with:
      - press
    - label: press
      definition: Apply sustained predominantly one-directional loading.
      include_when: []
      exclude_when: []
      confusable_with:
      - squeeze
    - label: squeeze
      definition: Apply opposing compressive actions from two sides.
      include_when: []
      exclude_when: []
      confusable_with: []
  - label: shape_manipulation
    definition: Actions intended to change shape.
    types:
    - label: bend
      definition: Apply an action that changes curvature.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: twist
      definition: Apply relative rotation to different sections.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: stretch
      definition: Apply tensile action that increases length.
      include_when: []
      exclude_when: []
      confusable_with: []
  - label: separation
    definition: Actions intended to separate material.
    types:
    - label: cut
      definition: Use a sharp edge to separate material.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: pierce
      definition: Drive a narrow object through a surface.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: tear
      definition: Pull flexible material apart along a propagating tear.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: shred
      definition: Repeatedly cut or tear material into many small strips or pieces.
      include_when: []
      exclude_when: []
      confusable_with: []
  - label: assembly
    definition: Actions that establish or remove spatial connections.
    types:
    - label: insert
      definition: Place one entity into another object or opening.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: remove
      definition: Take an entity out of a container, support, or assembly.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: attach
      definition: Establish a persistent connection.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: detach
      definition: Break a persistent connection.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: place
      definition: Set an entity at a target location or onto a support.
      include_when: []
      exclude_when: []
      confusable_with: []
  - label: fluid_handling
    definition: Actions that manipulate fluids or granular material.
    types:
    - label: pour
      definition: Tilt or position a source to transfer material under gravity.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: stir
      definition: Move a tool through material to induce mixing or circulation.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: spray
      definition: Expel material as a dispersed stream or droplets.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: dispense
      definition: Release a controlled quantity from a source or device.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: immerse
      definition: Move an object into a liquid or granular medium.
      include_when: []
      exclude_when: []
      confusable_with: []
  - label: thermal
    definition: Actions that add or remove thermal or radiative energy.
    types:
    - label: heat
      definition: Apply a visible or explicit heat source.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: cool
      definition: Apply a visible or explicit cooling source.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: irradiate
      definition: Expose an object to visible radiation as an intervention.
      include_when: []
      exclude_when: []
      confusable_with: []
  - label: ignition
    definition: Actions that initiate combustion.
    types:
    - label: ignite
      definition: Apply a flame, spark, or ignition source to begin burning.
      include_when: []
      exclude_when: []
      confusable_with: []
  - label: special
    definition: Fallback action labels.
    types:
    - label: none
      definition: No visible external intervention.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: other
      definition: A visible intervention exists but is outside the current ontology.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: unknown
      definition: A visible intervention may exist but cannot be classified reliably.
      include_when: []
      exclude_when: []
      confusable_with: []
  primary_families:
  - label: rigid_motion
    definition: Macroscopic motion of a largely shape-preserving object.
    types:
    - label: translation
      definition: Object position changes while rotation is not dominant.
      include_when: []
      exclude_when:
      - Only camera motion changes the view.
      confusable_with:
      - camera_only
    - label: rotation
      definition: Angular motion around an axis is the dominant process.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: rolling
      definition: Translation and rotation are coupled by contact with a surface.
      include_when: []
      exclude_when: []
      confusable_with:
      - sliding
    - label: sliding
      definition: Object translates along a support while contact points slip.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: free_fall
      definition: Unsupported downward motion dominated by gravity.
      include_when: []
      exclude_when:
      - The object is actively lowered or supported.
      confusable_with:
      - translation
    - label: projectile_motion
      definition: Free motion after release with a visible curved or ballistic trajectory.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: oscillation
      definition: Repeated motion around an equilibrium configuration.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: toppling
      definition: Loss of stability followed by rotation around a support edge or base.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: bouncing
      definition: Repeated or dominant contact-and-rebound motion of an object, such as a dribbled ball.
      include_when: []
      exclude_when: []
      confusable_with:
      - oscillation
      - collision
  - label: contact_loading
    definition: Mechanical contact and loading between entities.
    types:
    - label: collision
      definition: Previously separated entities undergo brief contact causing a visible response.
      include_when: []
      exclude_when: []
      confusable_with:
      - sustained_contact
      - compression_loading
    - label: sustained_contact
      definition: Contact persists and is central, without a brief collision dominating.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: compression_loading
      definition: Predominant loading reduces separation along the load direction.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: tension_loading
      definition: Predominant loading pulls parts apart along a tensile direction.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: shear_loading
      definition: Tangential loading drives relative motion between neighboring regions.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: penetration
      definition: One entity enters another object or material interior.
      include_when: []
      exclude_when: []
      confusable_with: []
  - label: deformation
    definition: Continuous visible change of object geometry.
    types:
    - label: compression_deformation
      definition: Object dimension decreases along a compressive direction.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: bending_deformation
      definition: Object centerline or surface curvature changes.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: stretching_deformation
      definition: Object length increases under tension.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: twisting_deformation
      definition: Different sections undergo relative angular displacement.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: shear_deformation
      definition: Material layers undergo tangential displacement.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: buckling
      definition: Compressive instability produces lateral bending or collapse.
      include_when: []
      exclude_when: []
      confusable_with: []
  - label: fracture_separation
    definition: Loss of structural integrity or material separation.
    types:
    - label: cracking
      definition: Visible crack forms while the object remains largely connected.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: breaking
      definition: Object loses overall integrity and separates into a small number of parts.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: shattering
      definition: Brittle object rapidly separates into many fragments.
      include_when: []
      exclude_when: []
      confusable_with:
      - fragmentation
    - label: fragmentation
      definition: Object forms multiple fragments without requiring brittle behavior.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: tearing
      definition: Flexible material separates along a propagating tear.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: shredding
      definition: Repeated cutting or tearing creates many small strips or pieces.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: cutting_separation
      definition: A cutting action visibly separates material.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: rupture
      definition: A membrane, shell, soft enclosure, or pressurized object loses integrity and opens or bursts, often releasing
        contents.
      include_when: []
      exclude_when: []
      confusable_with:
      - breaking
      - fragmentation
      - explosion
  - label: fluid_motion
    definition: Motion or redistribution of a continuous liquid.
    types:
    - label: bulk_flow
      definition: Liquid undergoes sustained macroscopic flow without a more specific dominant mode.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: pouring
      definition: Liquid transfers from a source under gravity, usually from a container edge.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: dripping
      definition: Discrete droplets form and detach intermittently.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: jetting
      definition: Directed, relatively coherent high-speed liquid stream.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: spraying
      definition: Liquid disperses into many small droplets over an angular region.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: splashing
      definition: Impact or disturbance ejects liquid outward or upward.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: droplet_motion
      definition: Motion of distinct droplets is the main process.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: free_surface_motion
      definition: Waves, ripples, foam, or surface variation without dominant transfer.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: viscous_spreading
      definition: High-viscosity liquid slowly spreads, sags, or levels.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: mixing
      definition: Distinct liquid regions or constituents visibly interpenetrate or homogenize.
      include_when: []
      exclude_when: []
      confusable_with: []
  - label: gas_particulate_motion
    definition: Motion, emission, or redistribution of gas, aerosol, or grains.
    types:
    - label: gas_flow
      definition: Macroscopic gas motion without a distinct source plume dominating.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: plume_motion
      definition: An already formed gas, smoke, or aerosol plume moves or evolves.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: gas_emission
      definition: Gas, vapor, smoke, or aerosol is visibly produced from a localized source.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: aerosol_dispersion
      definition: Visible suspended particles spread through a gas.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: granular_flow
      definition: Granular material flows collectively without a more specific mode.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: granular_pouring
      definition: Granular material transfers in a gravity-driven stream.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: granular_scattering
      definition: Particles are ejected or dispersed in multiple directions.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: granular_rearrangement
      definition: Particles locally rearrange without strong outward scattering.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: deposition
      definition: Moving gas-borne or granular material settles or accumulates on a surface.
      include_when: []
      exclude_when: []
      confusable_with: []
  - label: thermal_transfer
    definition: Visible process dominated by heating, cooling, or thermal radiation.
    types:
    - label: heating
      definition: Object or material visibly undergoes heating-related change without phase change dominating.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: cooling
      definition: Object or material visibly undergoes cooling-related change without phase change dominating.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: radiative_heating
      definition: Radiative energy visibly heats a target or contributes to a thermal, phase, or reaction change.
      include_when:
      - a target shows a visible thermal or phase response
      exclude_when:
      - sunset or ambient illumination change only
      - visible light beams without target heating
      confusable_with:
      - illumination_change
      - light_emission
  - label: phase_transition
    definition: Change between macroscopic material phases.
    types:
    - label: melting
      definition: Solid becomes liquid.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: solidification
      definition: Liquid becomes solid, including freezing.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: vaporization
      definition: Liquid becomes gas or vapor.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: condensation
      definition: Gas or vapor becomes liquid.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: boiling
      definition: Vapor bubbles form within a liquid and rise or escape, indicating liquid-to-gas transition.
      include_when: []
      exclude_when: []
      confusable_with:
      - vaporization
      - gas_emission
    - label: crystallization
      definition: An ordered solid or crystalline structure visibly forms or grows from another phase or solution.
      include_when: []
      exclude_when: []
      confusable_with:
      - solidification
      - deposition
  - label: combustion
    definition: Ignition and sustained exothermic burning processes.
    types:
    - label: ignition
      definition: Transition from non-burning to burning is the primary event.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: sustained_burning
      definition: Combustion continues over an observable interval after ignition.
      include_when:
      - visible flame or burning front persists
      exclude_when:
      - a brief non-combustive pressure burst
      - light emission without burning
      confusable_with:
      - ignition
      - explosion
  - label: explosive_release
    definition: A rapid release of stored energy or pressure that produces abrupt expansion, propulsion, fragmentation, or
      a blast-like event; combustion is not implied.
    types:

    definition: Scene-level optical interaction rather than camera focus behavior.
    types:
    - label: reflection
      definition: Light redirects from a surface and produces a visible reflected pattern or image.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: refraction
      definition: Light changes direction at an interface or through an optical element.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: scattering
      definition: Light redirects from particles or irregular structures into multiple directions.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: diffraction
      definition: Wave spreading or interference occurs around apertures or structures.
      include_when: []
      exclude_when: []
      confusable_with: []
    - label: absorption
